<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>『순례주택』 갈등 분류 활동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-main: "Noto Sans KR", Pretendard, -apple-system, sans-serif;
  --bg-main: #f6f8fb;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --card-bg: #ffffff;
  
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  
  --shadow-sm: 0 2px 5px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 16px rgba(0,0,0,0.08);

  --primary-color: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: #eef2ff;

  --zone-a-bg: #f0f7ff;
  --zone-a-border: #93c5fd;
  --zone-a-accent: #1d4ed8;

  --zone-b-bg: #f0fdf4;
  --zone-b-border: #86efac;
  --zone-b-accent: #15803d;

  --zone-c-bg: #fffbeb;
  --zone-c-border: #fde047;
  --zone-c-accent: #b45309;

  --zone-d-bg: #faf5ff;
  --zone-d-border: #d8b4fe;
  --zone-d-accent: #7e22ce;
}

* { box-sizing: border-box; }
body {
  font-family: var(--font-main);
  margin: 0;
  background-color: var(--bg-main);
  background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
  background-size: 20px 20px;
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 12px 16px 20px;
}

/* 상단 컴팩트 헤더 */
.header-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  border: 1px solid #e2e8f0;
  box-shadow: var(--shadow-sm);
  margin-bottom: 12px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.app-badge {
  background: var(--primary-soft);
  color: var(--primary-color);
  font-size: 12px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid rgba(79, 70, 229, 0.2);
}
h1 {
  font-size: 18px;
  font-weight: 800;
  margin: 0;
  color: #0f172a;
}
.step-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #cbd5e1;
  transition: all 0.25s ease;
}
.step-dot.active {
  width: 22px;
  border-radius: 6px;
  background: var(--primary-color);
}

/* 스테이지 전환 */
.stage { display: none; }
.stage.active { display: block; animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 2단계 전용: 좌우 분할 보드 */
.stage-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: var(--radius-md);
  padding: 8px 14px;
  margin-bottom: 10px;
}
.stage-title {
  font-size: 14.5px;
  font-weight: 700;
  color: #334155;
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary-color);
  font-weight: 700;
  font-size: 12.5px;
}

.workspace-split {
  display: grid;
  grid-template-columns: 46% 54%;
  gap: 12px;
  height: calc(100vh - 165px);
  min-height: 520px;
}

/* 왼쪽: 카드 보관함 */
.pool-panel {
  background: #fff;
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.pool-top {
  padding: 10px 14px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.pool-title {
  font-size: 14px;
  font-weight: 800;
  color: #1e293b;
}
.pool-desc {
  font-size: 11.5px;
  color: var(--text-secondary);
}
